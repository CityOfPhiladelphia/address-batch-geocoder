name: Security Audit

on:
    push:
        branches:
            - main
        paths:
            - 'uv.lock'
            - 'pyproject.toml'
    
    pull_request:
        branches:
            - main
    
    workflow_dispatch:

jobs:
    check-lockfile-and-audit:
        runs-on: ubuntu-latest
        permissions:
          contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            
            - name: Install uv
              uses: astral-sh/setup-uv@v7

              with:
                version: "latest"
            
            - name: Check if uv.lock is up to date
              run: uv lock --check
              
            - name: Audit dependencies
              run: uv audit